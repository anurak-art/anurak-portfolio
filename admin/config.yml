backend:
  name: github
  repo: anurak-art/anurak-portfolio
  branch: main
  base_url: https://www.dynasec.pro
  auth_endpoint: api/auth

media_folder: "content/uploads"
public_folder: "/content/uploads"

locale: "th"

collections:
  - name: "about"
    label: "เกี่ยวกับผม + ข้อมูลติดต่อ"
    files:
      - name: "about"
        label: "ข้อมูลโปรไฟล์"
        file: "content/about.json"
        fields:
          - {label: "แนะนำตัว (ไทย) - ย่อหน้า 1", name: "bio_th", widget: "text"}
          - {label: "แนะนำตัว (ไทย) - ย่อหน้า 2", name: "bio2_th", widget: "text"}
          - {label: "Introduction (English) - paragraph 1", name: "bio_en", widget: "text"}
          - {label: "Introduction (English) - paragraph 2", name: "bio2_en", widget: "text"}
          - {label: "กล่องชื่อ/ตำแหน่ง (ไทย)", name: "avatar_th", widget: "string", hint: "ใช้ <br> ถ้าต้องการขึ้นบรรทัดใหม่"}
          - {label: "Name/Title box (English)", name: "avatar_en", widget: "string", hint: "Use <br> for a line break"}
          - label: "ทักษะ / แท็กความเชี่ยวชาญ"
            name: "tags"
            widget: "list"
            field: {label: "แท็ก", name: "tag", widget: "string"}
          - {label: "อีเมลติดต่อ", name: "email", widget: "string"}
          - {label: "ที่ตั้ง (ไทย)", name: "location_th", widget: "string"}
          - {label: "Location (English)", name: "location_en", widget: "string"}

  - name: "cases"
    label: "ผลงาน (Case Studies)"
    files:
      - name: "cases"
        label: "รายการผลงาน"
        file: "content/cases.json"
        fields:
          - label: "รายการผลงาน"
            name: "items"
            widget: "list"
            summary: "{{fields.industry_th}}"
            fields:
              - {label: "อุตสาหกรรม (ไทย)", name: "industry_th", widget: "string"}
              - {label: "Industry (English)", name: "industry_en", widget: "string"}
              - {label: "โจทย์ (ไทย)", name: "challenge_th", widget: "text"}
              - {label: "Challenge (English)", name: "challenge_en", widget: "text"}
              - {label: "แนวทาง (ไทย)", name: "approach_th", widget: "text"}
              - {label: "Approach (English)", name: "approach_en", widget: "text"}
              - {label: "ผลลัพธ์ (ไทย)", name: "outcome_th", widget: "text"}
              - {label: "Outcome (English)", name: "outcome_en", widget: "text"}

  - name: "certifications"
    label: "ใบรับรอง (Certifications)"
    files:
      - name: "certifications"
        label: "รายการใบรับรอง"
        file: "content/certifications.json"
        fields:
          - label: "รายการใบรับรอง"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "ชื่อใบรับรอง", name: "name", widget: "string"}
              - {label: "ผู้ออกใบรับรอง", name: "issuer", widget: "string"}

  - name: "solutions"
    label: "โซลูชัน / เครื่องมือ"
    files:
      - name: "solutions"
        label: "รายการโซลูชัน"
        file: "content/solutions.json"
        fields:
          - label: "รายการโซลูชัน"
            name: "items"
            widget: "list"
            summary: "{{fields.name_th}}"
            fields:
              - {label: "ชื่อกลุ่มโซลูชัน (ไทย)", name: "name_th", widget: "string"}
              - {label: "Category Name (English)", name: "name_en", widget: "string"}
              - {label: "ภัยคุกคามที่ควบคุม (ไทย)", name: "threat_th", widget: "text"}
              - {label: "Threat Controlled (English)", name: "threat_en", widget: "text"}
              - {label: "หน้าที่หลัก (ไทย)", name: "fn_th", widget: "text"}
              - {label: "Core Function (English)", name: "fn_en", widget: "text"}
              - label: "ตัวอย่างเทคโนโลยี"
                name: "tools"
                widget: "list"
                field: {label: "เทคโนโลยี", name: "tool", widget: "string"}

  - name: "blog"
    label: "บทความ (Blog)"
    files:
      - name: "blog"
        label: "รายการบทความ"
        file: "content/blog.json"
        fields:
          - label: "บทความ"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} · {{fields.title_th}}"
            fields:
              - {label: "ชื่อลิงก์ (slug)", name: "slug", widget: "string", hint: "นี่คือส่วนท้ายของ URL (dynasec.pro/blog/ชื่อลิงก์) ใช้ภาษาอังกฤษพิมพ์เล็กและ - คั่นคำ ห้ามซ้ำ และไม่ควรเปลี่ยนหลังเผยแพร่แล้ว"}
              - {label: "วันที่เผยแพร่", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "วันที่อัปเดตล่าสุด (ถ้าแก้ไขเนื้อหาสำคัญ)", name: "updated", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Google ใช้วันที่นี้ประกอบการแสดงผล ใส่เมื่อแก้ไขเนื้อหาจริงเท่านั้น"}
              - label: "แท็ก"
                name: "tags"
                widget: "list"
                required: false
                field: {label: "แท็ก", name: "tag", widget: "string"}
              - {label: "ชื่อบทความ (ไทย)", name: "title_th", widget: "string"}
              - {label: "Title (English)", name: "title_en", widget: "string", required: false}
              - {label: "คำโปรย (ไทย) — แสดงเป็นคำอธิบายบน Google", name: "summary_th", widget: "text", hint: "เขียน 1-2 ประโยค ประมาณ 100-150 ตัวอักษร สรุปประเด็นหลักของบทความ ไม่ซ้ำกับบทความอื่น"}
              - {label: "Summary (English) — shown as the Google description", name: "summary_en", widget: "text", required: false, hint: "1-2 sentences, about 110-155 characters. Unique per article."}
              - {label: "เนื้อหา (ไทย)", name: "body_th", widget: "text", hint: "เว้น 1 บรรทัดเพื่อขึ้นย่อหน้าใหม่ | ขึ้นต้นด้วย ## คือหัวข้อ | ขึ้นต้นด้วย - คือรายการ | ใส่ **ตัวหนา** ได้ | ลิงก์ [ข้อความลิงก์](https://...) หรือลิงก์ไปบทความอื่น [ข้อความ](post:slug-ของบทความ)"}
              - {label: "Body (English)", name: "body_en", widget: "text", required: false, hint: "Leave a blank line for a new paragraph | ## heading | - bullet | **bold**. If empty, the Thai text is shown."}
              - label: "Infographic (ใส่ได้หลายรูป ไม่ใส่ก็ได้)"
                name: "infographics"
                widget: "list"
                required: false
                summary: "{{fields.type}} · {{fields.title_th}}"
                fields:
                  - label: "รูปแบบ"
                    name: "type"
                    widget: "select"
                    options:
                      - {label: "ขั้นตอน (steps): ลำดับ 1-2-3 ต่อเนื่อง", value: "steps"}
                      - {label: "เปรียบเทียบระดับ (spectrum): แท่งกราฟน้อย-มาก", value: "spectrum"}
                      - {label: "ลำดับเหตุการณ์ (flow): กล่องเชื่อมด้วยลูกศร", value: "flow"}
                      - {label: "สองฝั่ง (columns): ความเสี่ยง vs วิธีรับมือ", value: "columns"}
                      - {label: "แกนกลาง (hub): แนวคิดหลัก + องค์ประกอบ", value: "hub"}
                  - {label: "หัวข้อ Infographic (ไทย)", name: "title_th", widget: "string"}
                  - {label: "Infographic title (English)", name: "title_en", widget: "string", required: false}
                  - {label: "ข้อความกลาง (ไทย) [ใช้กับ hub]", name: "center_th", widget: "string", required: false}
                  - {label: "Center text (English) [hub]", name: "center_en", widget: "string", required: false}
                  - {label: "ข้อความกลางบรรทัดเล็ก (ไทย) [hub]", name: "center_note_th", widget: "string", required: false}
                  - {label: "Center small text (English) [hub]", name: "center_note_en", widget: "string", required: false}
                  - {label: "ป้าย A (ไทย) [columns: หัวฝั่งซ้าย / spectrum: ปลายซ้ายของแกน]", name: "label_a_th", widget: "string", required: false}
                  - {label: "Label A (English)", name: "label_a_en", widget: "string", required: false}
                  - {label: "ป้าย B (ไทย) [columns: หัวฝั่งขวา / spectrum: ปลายขวาของแกน]", name: "label_b_th", widget: "string", required: false}
                  - {label: "Label B (English)", name: "label_b_en", widget: "string", required: false}
                  - label: "รายการภายใน"
                    name: "items"
                    widget: "list"
                    summary: "{{fields.label_th}}"
                    fields:
                      - {label: "หัวข้อ (ไทย)", name: "label_th", widget: "string"}
                      - {label: "Label (English)", name: "label_en", widget: "string", required: false}
                      - {label: "คำอธิบายสั้น (ไทย)", name: "detail_th", widget: "string", required: false}
                      - {label: "Short detail (English)", name: "detail_en", widget: "string", required: false}
                      - {label: "ระดับ 1-5 [เฉพาะ spectrum]", name: "level", widget: "number", value_type: "int", min: 1, max: 5, required: false}
                      - label: "ฝั่ง [เฉพาะ columns]"
                        name: "side"
                        widget: "select"
                        required: false
                        options:
                          - {label: "ฝั่ง A (ซ้าย / สีแดง)", value: "a"}
                          - {label: "ฝั่ง B (ขวา / สีเขียว)", value: "b"}
                      - label: "โทนสี [เฉพาะ flow]"
                        name: "tone"
                        widget: "select"
                        required: false
                        options:
                          - {label: "ปกติ", value: ""}
                          - {label: "อันตราย (สีแดง)", value: "danger"}
                          - {label: "ดี (สีเขียว)", value: "ok"}
